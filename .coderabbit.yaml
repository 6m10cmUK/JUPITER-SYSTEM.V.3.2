language: "ja-JP"
reviews:
  profile: "chill" # より詳細なレビュー
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  path_filters:
    - "!node_modules/**"
    - "!dist/**"
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "src/**/*.ts"
      instructions: "TypeScriptのベストプラクティスとDDD（ドメイン駆動設計）の観点からレビューしてください"
    - path: "src/domain/**"
      instructions: "ドメイン層のビジネスロジックと責務分離を重点的にレビューしてください"
    - path: "src/infrastructure/commands/**"
      instructions: "コマンドの実装とDiscord APIの使用方法をレビューしてください"
    - path: "src/interactions/**"
      instructions: "ユーザーインタラクションの処理と状態管理をレビューしてください"

knowledge_base:
  opt_out: false

chat:
  auto_reply: true