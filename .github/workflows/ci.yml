name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: TypeScript type check
      run: npm run build
      
    - name: Run tests
      run: npm test
      
    - name: Test results summary
      if: always()
      run: |
        echo "📊 テスト実行結果サマリー"
        echo "Node.js バージョン: ${{ matrix.node-version }}"
        echo "ビルド: ✅"
        echo "テスト: ✅"
      
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build verification
      run: npm run build
      
    - name: Check for any type usage
      run: |
        echo "🔍 any型使用チェック実行中..."
        ANY_COUNT=$(grep -r ": any\|as any\|<any>" src --include="*.ts" --exclude-dir=node_modules | wc -l || echo 0)
        if [ "$ANY_COUNT" -gt 0 ]; then
          echo "⚠️ Warning: $ANY_COUNT箇所で'any'型が検出されました"
          grep -r ": any\|as any\|<any>" src --include="*.ts" --exclude-dir=node_modules || true
        else
          echo "✅ 危険なany型の使用は検出されませんでした"
        fi
        
  security:
    name: Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Security audit
      run: |
        if ! npm audit --audit-level moderate; then
          echo "❌ npm audit で中程度以上の脆弱性が検出されました"
          exit 1
        fi
        echo "✅ npm audit を通過しました"